name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── 1. Run test suite ───────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q

  # ── 2. Build & deploy to Heroku (main branch only) ─────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # Download model checkpoints directly from Kaggle notebook output.
      # No Google Drive needed — Kaggle API token stored in GitHub Secrets.
      - name: Download model checkpoints from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install -q kaggle
          mkdir -p checkpoints

          echo "Downloading notebook output from Kaggle..."
          kaggle kernels output visheshsrivastava/notebookb99e7c18d9 -p /tmp/kaggle_output

          echo "Locating checkpoint files..."
          python - << 'EOF'
          import pathlib, shutil, sys

          src_root = pathlib.Path("/tmp/kaggle_output")
          dst_root = pathlib.Path("checkpoints")
          dst_root.mkdir(exist_ok=True)

          FILES = ["best_model.pt", "autoencoder_best.pt", "segmentation_best.pt"]
          MIN_BYTES = 1_000_000

          for fname in FILES:
              matches = list(src_root.rglob(fname))
              if not matches:
                  print(f"FATAL: {fname} not found in Kaggle output.")
                  print("  Make sure the notebook ran successfully and saved checkpoints.")
                  sys.exit(1)
              src = matches[0]
              dst = dst_root / fname
              shutil.copy2(src, dst)
              mb = dst.stat().st_size / 1_048_576
              if dst.stat().st_size < MIN_BYTES:
                  print(f"FATAL: {fname} is too small ({mb:.1f} MB) — training may have failed.")
                  sys.exit(1)
              print(f"  OK  {fname}  ({mb:.1f} MB)")

          print("All checkpoints ready.")
          EOF

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Log in to Heroku Container Registry
        run: echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build Docker image
        run: docker build -t registry.heroku.com/geospatial-ml/web .

      - name: Push to Heroku Container Registry
        run: docker push registry.heroku.com/geospatial-ml/web

      - name: Release on Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:release web --app geospatial-ml
          echo "Deployed to https://geospatial-ml-374ed002e5df.herokuapp.com"
