name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── 1. Run test suite ───────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q

  # ── 2. Build & deploy to Heroku (main branch only) ─────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # Download model checkpoints from Kaggle Dataset.
      # Dataset: visheshsrivastava/geospatial-checkpoints
      # Updated automatically by the Kaggle training notebook (Step 8).
      - name: Download model checkpoints from Kaggle Dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          pip install -q kaggle
          mkdir -p checkpoints

          echo "Downloading geospatial-checkpoints dataset from Kaggle..."
          kaggle datasets download visheshsrivastava/geospatial-checkpoints \
            --path checkpoints/ --unzip

          echo "Verifying checkpoint files..."
          python - << 'EOF'
          import pathlib, sys
          dst_root = pathlib.Path("checkpoints")
          FILES = ["best_model.pt", "autoencoder_best.pt", "segmentation_best.pt"]
          MIN_BYTES = 1_000_000
          for fname in FILES:
              matches = list(dst_root.rglob(fname))
              if not matches:
                  print(f"FATAL: {fname} not found in downloaded dataset.")
                  sys.exit(1)
              f = matches[0]
              mb = f.stat().st_size / 1_048_576
              if f.stat().st_size < MIN_BYTES:
                  print(f"FATAL: {fname} too small ({mb:.1f} MB) — training may have failed.")
                  sys.exit(1)
              dest = dst_root / fname
              if f != dest:
                  f.rename(dest)
              print(f"  OK  {fname}  ({mb:.1f} MB)")
          print("All checkpoints ready.")
          EOF

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Log in to Heroku Container Registry
        run: echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build Docker image
        run: docker build -t registry.heroku.com/geospatial-ml/web .

      - name: Push to Heroku Container Registry
        run: docker push registry.heroku.com/geospatial-ml/web

      - name: Release on Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku container:release web --app geospatial-ml
          echo "Deployed to https://geospatial-ml-374ed002e5df.herokuapp.com"
