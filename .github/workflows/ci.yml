name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── 1. Run test suite ───────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q

  # ── 2. Build & deploy to Heroku (main branch only) ─────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # Download model checkpoints from Google Drive in the Actions runner.
      # This is more reliable than downloading inside Docker because:
      #   - Actions runners have uncapped network access
      #   - gdown works better outside Docker build isolation
      #   - Failures surface immediately with clear logs
      - name: Download model checkpoints from Google Drive
        run: |
          pip install gdown requests
          python - << 'EOF'
          import json, pathlib, sys, time
          import gdown

          with open("model_config.json") as f:
              config = json.load(f)

          FILES = {
              "best_model.pt":        config.get("best_model", ""),
              "autoencoder_best.pt":  config.get("autoencoder", ""),
              "segmentation_best.pt": config.get("segmentation", ""),
          }

          MIN_BYTES = 1_000_000
          pathlib.Path("checkpoints").mkdir(exist_ok=True)

          for fname, file_id in FILES.items():
              dest = pathlib.Path("checkpoints") / fname

              if not file_id:
                  print(f"FATAL: No Drive ID for {fname} in model_config.json")
                  print("  → Re-run the Colab notebook (Step 8) to upload models.")
                  sys.exit(1)

              print(f"\nDownloading {fname} (Drive ID: {file_id}) ...")
              success = False

              for attempt in range(1, 4):
                  try:
                      out = gdown.download(id=file_id, output=str(dest), quiet=False)
                      if out and dest.exists() and dest.stat().st_size >= MIN_BYTES:
                          success = True
                          break
                      print(f"  Attempt {attempt}: file too small or None, retrying...")
                      time.sleep(3)
                  except Exception as e:
                      print(f"  Attempt {attempt} failed: {e}")
                      time.sleep(3)

              if not success:
                  print(f"\nFATAL: Could not download {fname} after 3 attempts.")
                  print("  Check: file is shared as 'Anyone with the link → Viewer' in Drive.")
                  print("  Fix  : Re-run Colab Step 8 to re-share files and update model_config.json.")
                  sys.exit(1)

              mb = dest.stat().st_size / 1_048_576
              print(f"  ✓ {fname}  {mb:.1f} MB")

          print("\nAll checkpoints downloaded successfully.")
          EOF

      - name: Log in to Heroku Container Registry
        run: echo "${{ secrets.HEROKU_API_KEY }}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build Docker image
        run: docker build -t registry.heroku.com/geospatial-ml/web .

      - name: Push to Heroku Container Registry
        run: docker push registry.heroku.com/geospatial-ml/web

      - name: Release on Heroku
        run: |
          IMAGE_ID=$(docker inspect --format='{{index .RepoDigests 0}}' registry.heroku.com/geospatial-ml/web)
          curl -s -X PATCH https://api.heroku.com/apps/geospatial-ml/formation \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"updates\":[{\"type\":\"web\",\"docker_image\":\"${IMAGE_ID}\"}]}"
          echo "Deployed to https://geospatial-ml-374ed002e5df.herokuapp.com"
